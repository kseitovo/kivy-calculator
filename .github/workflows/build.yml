name: Build APK with Buildozer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache \
          python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
          libavcodec-dev zlib1g-dev libunwind-dev autoconf libtool pkg-config \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld

    - name: Install Python Pip & Buildozer
      run: |
        pip install --upgrade pip
        pip install "cython<3.0" virtualenv buildozer

    - name: Build APK with Buildozer
      env:
        # Автоматичне прийняття ліцензій Android SDK на рівні системи GitHub
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        BUILDOZER_ACCEPT_ANDROID_SDK_LICENSE: "y"
      run: |
        rm -rf ~/.buildozer .buildozer
        buildozer android debug
